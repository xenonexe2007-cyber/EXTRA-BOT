services:
  - type: web
    name: x-extra-earning-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: x-extra-earning-db
          property: connectionString
      - key: REFERRAL_BONUS
        value: "10"
      - key: MIN_WITHDRAW
        value: "100"
databases:
  - name: x-extra-earning-db
    plan: free
